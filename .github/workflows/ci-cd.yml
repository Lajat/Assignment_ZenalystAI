name: Build, Test, Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [created, published]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Copy env template
        run: cp .env.example .env

      - name: Build and start stack
        run: docker compose up --build -d

      - name: Wait for services to report healthy
        run: |
          echo "Waiting for products/invoices services to pass health checks..."
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/api/products > /dev/null && \
               curl -sf http://localhost:8080/api/invoices > /dev/null; then
              echo "Services healthy."
              exit 0
            fi
            sleep 3
          done
          echo "Services did not become healthy in time."
          docker compose logs
          exit 1

      - name: Run products-service tests
        working-directory: ./products-service
        run: node test.js
        env:
          TEST_BASE_URL: http://localhost:8080/api/products

      - name: Run invoice-service tests
        working-directory: ./invoice-service
        run: node test.js
        env:
          TEST_BASE_URL: http://localhost:8080/api/invoices

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------
  # BETA
  # PR to main -> deploy the feature branch to beta
  # ---------------------------------------------------------
  deploy-beta:
    needs: build-and-test
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Deploy to Beta VM
        run: |
          echo "Placeholder: SSH to the Beta VM, pull feature branch, docker compose up --build -d"
          echo "Real implementation needs VM host/SSH key as repo secrets — left"
          echo "as a stub here since there's no real target VM in this take-home."

      - name: Post-deploy Beta health check
        run: |
          echo "Placeholder: curl the deployed Beta /health endpoint."
          echo "If this step fails, the Beta rollback job below runs automatically."

  deploy-beta-rollback:
    needs: deploy-beta
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Roll back Beta
        run: |
          echo "Placeholder: re-run 'docker compose up -d' against the"
          echo "previous known-good image tag / compose file on the Beta VM."
          echo "This is what turns a bad deploy from an outage into a"
          echo "same-minute recovery — see README risk #3."

  # ---------------------------------------------------------
  # QA
  # Push to main -> deploy main to QA
  # ---------------------------------------------------------
  deploy-qa:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Deploy to QA VM
        run: |
          echo "Placeholder: SSH to the QA VM, pull latest main, docker compose up --build -d"
          echo "Real implementation needs VM host/SSH key as repo secrets — left"
          echo "as a stub here since there's no real target VM in this take-home."

      - name: Post-deploy QA health check
        run: |
          echo "Placeholder: curl the deployed QA /health endpoint."
          echo "If this step fails, the QA rollback job below runs automatically."

  deploy-qa-rollback:
    needs: deploy-qa
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Roll back QA
        run: |
          echo "Placeholder: re-run 'docker compose up -d' against the"
          echo "previous known-good image tag / compose file on the QA VM."
          echo "This is what turns a bad deploy from an outage into a"
          echo "same-minute recovery — see README risk #3."

  # ---------------------------------------------------------
  # PROD
  # Release -> deploy the released version to production
  # ---------------------------------------------------------
  deploy-prod:
    needs: build-and-test
    if: github.event_name == 'release' && (github.event.action == 'created' || github.event.action == 'published')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Deploy to Production VM
        run: |
          echo "Placeholder: SSH to the Production VM, pull release, docker compose up --build -d"
          echo "Real implementation needs VM host/SSH key as repo secrets — left"
          echo "as a stub here since there's no real target VM in this take-home."

      - name: Post-deploy Production health check
        run: |
          echo "Placeholder: curl the deployed Production /health endpoint."
          echo "If this step fails, the Production rollback job below runs automatically."

  deploy-prod-rollback:
    needs: deploy-prod
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Roll back Production
        run: |
          echo "Placeholder: re-run 'docker compose up -d' against the"
          echo "previous known-good image tag / compose file on the Production VM."
          echo "This is what turns a bad deploy from an outage into a"
          echo "same-minute recovery — see README risk #3."
