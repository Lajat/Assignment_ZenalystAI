events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Each upstream has 2 replicas — nginx load-balances across them
    # with the default round-robin algorithm.
    upstream products_backend {
        server products1:3000;
        server products2:3000;
        server products3:3000;
        server products4:3000;
    }

    upstream invoices_backend {
        server invoices1:3000;
        server invoices2:3000;
        server invoices3:3000;
    }

    server {
        listen 80;
        server_name _;

        limit_req zone=api_limit burst=20 nodelay;

        # Static demo UI
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        # Routed + load-balanced to the products service replicas
        location /api/products {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://products_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Routed + load-balanced to the invoice service replicas
        location /api/invoices {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://invoices_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health {
            access_log off;
            return 200 "ok\n";
        }
    }
}
